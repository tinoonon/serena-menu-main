<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Serena Menu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            overflow: hidden;
        }
        
        img {
            display: block;
            /* Recorta a imagem para mostrar apenas a parte rosa central */
            clip-path: inset(112px 320px 112px 320px);
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./base22.png" alt="Serena Menu">
    </div>
</body>
</html>
